[project]
name = "tax-agent"
version = "0.1.0"
description = "Evaluation, tracing and cost comparison for a mock year-end tax settlement agent"
readme = "README.md"
authors = [
    { name = "jooniorp" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langfuse>=4.18.0",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tax-agent = "tax_agent.cli:main"
eval = "tax_agent.evaluation.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
